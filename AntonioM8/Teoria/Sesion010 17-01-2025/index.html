<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <div class="container">
        <form action="formularios.html" style= "text-align: center; margin:auto; width: 25%; display: flex; flex-direction: column;"
        <label for="name">Nombre</label>
        <input type="text" id="name" name="nombre" required placeholder="Pon Tu Nombre Aqui">

        <label for="surname">Apellidos</label>
        <input type="text" id="surname" name="Cognom">

        <label for="email">Correo Electronico</label>
        <input type="email">
        <input type="date">

        <label for="mensaje"></label>
        <textarea name="mensaje" id="mensaje">Mensaje</textarea>

        <label for="femenino">femenino</label>
        <input type="radio" id="femenino" name="genero" value="femenino">

        <br>
        <p>intereses</p>
        <input type="checkbox" id="deportes" name="intereses" value="deportes">
        <label for="deportes">Deportes</label>
        <input type="checkbox" id="musica" name="intereses" value="musica">
        <label for="musica">Musica</label>

        <label for="selecion-genero">Genero</label>
        <select name="gen" id="seleccion-genero">
        <option value="">Selección Un Genero</option>

        <option value="rap">Rap</option>
        <option value="Rock">Rock</option>
        <option value="Pop">Pop</option>
        <option value="Punk">Punk</option>
        <option value="Techno">Techno</option>
        <option value="Trance">Trance</option>
           
        </select>

        <button type="submit">Enviar</button>
    </form>    
    </div>
</body>
</html>
